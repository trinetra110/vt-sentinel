name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: vt-sentinel
            release_name: vt-sentinel-linux
          - os: macos-latest
            binary_name: vt-sentinel
            release_name: vt-sentinel-macos
          - os: windows-latest
            binary_name: vt-sentinel.exe
            release_name: vt-sentinel-windows.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Executable
        run: pyinstaller --onefile --name vt-sentinel main.py

      - name: Rename Binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv dist/${{ matrix.binary_name }} dist/${{ matrix.release_name }}

      - name: Rename Binary (Windows)
        if: runner.os == 'Windows'
        run: Rename-Item -Path "dist\${{ matrix.binary_name }}" -NewName "${{ matrix.release_name }}"

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.release_name }}
